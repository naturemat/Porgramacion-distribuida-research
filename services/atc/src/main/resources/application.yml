server:
  port: 8087
spring:
  application:
    name: attendance-compliance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cumplimiento_db}
    username: ${DB_USER:mentora}
    password: ${DB_PASSWORD:mentora}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: modulo-c.attendance-compliance-service.consumidor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
